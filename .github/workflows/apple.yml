name: Apple build and scheduler tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Validate repository
        run: python3 scripts/check_project.py
      - name: Test the real Swift scheduler
        run: swift test
      - name: Build iPad simulator application
        run: >-
          xcodebuild -project ShabbatTV.xcodeproj -scheme ShabbatTV
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned device archive
        run: >-
          xcodebuild -project ShabbatTV.xcodeproj -scheme ShabbatTV
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath build/ShabbatTV-unsigned.xcarchive
          CODE_SIGNING_ALLOWED=NO archive
      - name: Launch on iPad simulator and capture the real interface
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPad" in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/simulator/Build/Products/Debug-iphonesimulator/ShabbatTV.app
          xcrun simctl launch "$DEVICE" com.shabbattv.ipad
          sleep 8
          xcrun simctl io "$DEVICE" screenshot build/ipad-simulator.png
      - uses: actions/upload-artifact@v4
        with:
          name: iPad-simulator-screen
          path: build/ipad-simulator.png
          retention-days: 14
      - name: Package unsigned archive (not installable)
        run: ditto -c -k --sequesterRsrc --keepParent build/ShabbatTV-unsigned.xcarchive build/ShabbatTV-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ShabbatTV-unsigned-not-installable
          path: build/ShabbatTV-unsigned.zip
          retention-days: 14
